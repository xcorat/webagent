[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paibinder"
version = "0.1.0"
description = "Python AI Binder — context engineering engine, retrieval tools, and FastAPI SSE API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-ai>=0.1.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
paibinder-seed = "paibinder.cli.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["paibinder"]
